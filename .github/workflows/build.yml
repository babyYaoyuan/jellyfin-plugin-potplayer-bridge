name: build

on:
  push:
  pull_request:

env:
  PLUGIN_VERSION: 0.1.0.0

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\PotPlayerBridge.slnx

      - name: Test
        run: dotnet test .\PotPlayerBridge.slnx -c Release --no-restore --nologo

      - name: Publish
        run: dotnet publish .\src\Jellyfin.Plugin.PotPlayerBridge\Jellyfin.Plugin.PotPlayerBridge.csproj -c Release --no-restore --nologo -o .\artifacts\publish

      - name: Package
        shell: pwsh
        run: .\scripts\package.ps1 -Version $env:PLUGIN_VERSION -SkipBuild

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Jellyfin.Plugin.PotPlayerBridge-${{ env.PLUGIN_VERSION }}
          path: artifacts/release/*
          if-no-files-found: error
